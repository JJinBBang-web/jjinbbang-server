name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew clean test build --no-daemon

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/jjinbbang-web/jjinbbang-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dispatch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: JJinBBang-web
          repositories: jjinbbang-lab
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE: ghcr.io/jjinbbang-web/jjinbbang-server
          TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          gh api --method POST repos/JJinBBang-web/jjinbbang-lab/dispatches \
            -f event_type=admin-image-built \
            -f client_payload[component]=server \
            -f client_payload[image]="$IMAGE" \
            -f client_payload[tag]="$TAG" \
            -f client_payload[source_repository]="${{ github.repository }}" \
            -f client_payload[source_sha]="$TAG" \
            -f client_payload[image_digest]="$IMAGE_DIGEST"
