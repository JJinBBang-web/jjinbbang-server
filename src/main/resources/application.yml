spring:
  application:
    name: jjinbbang-server
  # 로컬 접속 정보는 `.env` 에 둔다 (커밋되지 않음). 없으면 그냥 건너뛴다 —
  # dev · prod 는 이 파일 없이 환경변수로 주입받는다.
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  session:
    timeout: 8h
    jdbc:
      initialize-schema: never
  web:
    error:
      whitelabel:
        enabled: false

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: JJINBBANG_ADMIN_SESSION
        http-only: true
        same-site: lax
