spring:
  application:
    name: jjinbbang-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  session:
    timeout: 8h
    jdbc:
      initialize-schema: never
  web:
    error:
      whitelabel:
        enabled: false

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: JJINBBANG_ADMIN_SESSION
        http-only: true
        same-site: lax
