spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          authentik:
            provider: authentik
            client-id: ${AUTHENTIK_CLIENT_ID}
            client-secret: ${AUTHENTIK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          authentik:
            issuer-uri: ${AUTHENTIK_ISSUER_URI}

server:
  servlet:
    session:
      cookie:
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  auth:
    oidc-enabled: true
    admin-group: ${AUTHENTIK_ADMIN_GROUP:jjinbbang-backoffice-admins}
    login-success-uri: ${ADMIN_LOGIN_SUCCESS_URI:/api/admin/auth/me}

logging:
  level:
    root: info
    com.jjinbbang.server: debug
